<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback Form</title>
    <link rel="stylesheet" href="index.css" />
    <link rel="icon" href="plane.svg" />
  </head>
  <body>
    <main>
      <section id="formHeader" class="form-header">
        <h1>Welcome to our feedback form!</h1>
        <p>
          Before proceeding, please read our
          <span id="apologySpan" class="apology-span"> formal apologies for the trouble and emotional distress our services may have caused you</span>.
        </p>
      </section>
      <div class="line"></div>
      <section class="form-user-info">
        <h2>User Information</h2>
        <div class="form-fields-wrapper">
          <div class="form-user-field">
            <input class="label-input" type="text" placeholder="Your name" />
            <label class="input-label">Name</label>
          </div>
          <div class="form-user-field">
            <input class="label-input" type="text" placeholder="Email" />
            <label class="input-label">jane.doeZZZ@gmail.com</label>
          </div>
          <div id="numberSliderDiv" class="form-user-field number-slider-div">
            <input class="label-input" type="text" placeholder="Contact number" disabled />
            <label id="fakeLabelForSlider" class="input-label">+55 33 93215-1239</label>
          </div>
        </div>
      </section>
      <section class="form-feedback-report">
        <h2>Feedback</h2>
        <div class="form-fields-wrapper">
          <div class="form-feedback-field">
            <input id="feedback-label" class="label-input" type="text" placeholder="Please inform us in detail about your experience" disabled />
            <textarea class="input-label textarea-feedback">
// TODO: ease this textarea anxieties. It's getting alarming, may have to do with the not yet implemented SQL Injection preventions.</textarea
            >
          </div>
        </div>
      </section>
      <section class="form-submit">
        <button class="submit-button" disabled>Submit</button>
      </section>
    </main>
    <div class="move-btn"></div>
  </body>
  <script type="module" src="index.js"></script>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback Form</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main>
      <section id="formHeader" class="form-header">
        <h1>Welcome to our feedback form!</h1>
        <p>
          Before proceeding, please read our
          <span id="apologySpan" class="apology-span"> formal apologies for the trouble and emotional distress our services may have caused you</span>.
        </p>
      </section>
      <div class="line" />
      <section class="form-personal-info">
        <div class="form-personal-camp">
          <label>Your name</label>
          <input type="text" />
        </div>
        <div class="form-personal-camp">
          <input class="label-input" type="text" placeholder="Your name" />
          <label id="inputLabel" class="input-label">Your name</label>
        </div>
      </section>
    </main>
  </body>
  <script type="module" src="index.js"></script>
</html>
